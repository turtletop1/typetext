<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF & Article Typing Game</title>
    
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <link rel="stylesheet" href="style.css">
    
</head>

<body>

<div class="container">

    <!-- ================= HEADER ================= -->
    <header>
        <h1>🎮 Typing Game</h1>
        <p>PDF & Online Article Typing Practice</p>
    </header>

    <!-- ================= MODE SELECT ================= -->

    <section class="mode-section">
        <h2>Choose Game Mode</h2>
        <div class="mode-buttons">
            <button id="pdf-mode-btn" class="mode-btn active">📄 PDF Mode</button>
            <button id="article-mode-btn" class="mode-btn">🌐 Article Mode</button>
        </div>
    </section>

    <!-- =================================================
         PDF MODE
    ================================================== -->

    <section id="pdf-mode" class="mode-panel">
        <h2>📄 Import PDF</h2>

        <!-- PDF URL -->
        <div class="url-row">
            <input id="pdf-url" type="url" placeholder="Paste PDF URL...">
            <button id="load-url-btn" class="primary-btn">Load</button>
        </div>

        <div class="divider">OR</div>

        <!-- Local PDF -->
        <label for="pdf-upload" class="upload-btn">📂 Upload PDF</label>
        <input id="pdf-upload" type="file" accept="application/pdf" hidden>

        <!-- PDF Metadata & Page Selection -->
        <div class="pdf-info" style="margin-top: 15px; display: flex; flex-direction: column; gap: 8px;">
            <div>
                <strong id="pdf-name"></strong>
                <span id="pdf-pages" style="color: #666; margin-left: 8px;"></span>
            </div>

            <!-- 頁數選擇區域 -->
            <div id="page-range-container" class="hidden" style="display: flex; align-items: center; gap: 8px; font-size: 0.95em;">
                <label for="pdf-start-page">頁數範圍（起始）：</label>
                <input type="number" id="pdf-start-page" min="1" value="1" style="width: 65px; padding: 4px; text-align: center;">
                <span>至</span>
                <label for="pdf-end-page" class="sr-only">頁數範圍（結束）：</label>
                <input type="number" id="pdf-end-page" min="1" value="1" style="width: 65px; padding: 4px; text-align: center;">
                <button id="apply-page-range-btn" class="secondary-btn" style="padding: 4px 10px;">套用頁數</button>
            </div>
        </div>

        <p id="pdf-status" class="status">
            Upload a PDF or enter a PDF URL.
        </p>
    </section>

    <!-- =================================================
         ARTICLE MODE
    ================================================== -->

    <section id="article-mode" class="mode-panel hidden">

        <div class="article-selector" style="display: flex; gap: 10px; margin-bottom: 15px;">
            <!-- 第一層：分類選單 -->
            <div>
                <label for="categorySelect">選擇分類：</label>
                <select id="categorySelect">
                    <option value="">-- 選擇分類 --</option>
                </select>
            </div>

            <!-- 第二層：文章選單 -->
            <div>
                <label for="articleSelect">選擇文章：</label>
                <select id="articleSelect" disabled>
                    <option value="">-- 請先選擇分類 --</option>
                </select>
            </div>
        </div>

        <button id="toggleFormBtn" style="padding: 8px 16px; margin-bottom: 10px; cursor: pointer;">
            ➕ 新增文章
        </button>

        <!-- 升級版：新增文章表單區塊 -->
        <div id="addArticleContainer" class="add-article-container" style="display: none; border: 1px solid #ccc; border-radius: 8px; padding: 15px; margin-top: 10px; background-color: #fafafa;">
            <h3>➕ 新增文章並匯出 JSON</h3>

            <!-- 1. 分類名稱 -->
            <label for="newCategory">文章分類（可手動輸入或使用現有）：</label><br>
            <input type="text" id="newCategory" placeholder="例如: 基礎科技、進階閱讀" style="width: 100%; margin-bottom: 10px; padding: 6px; box-sizing: border-box;"><br>

            <!-- 文章標題 -->
            <label for="newTitle">文章標題：</label><br>
            <input type="text" id="newTitle" placeholder="例如: Artificial Intelligence Basics" style="width: 100%; margin-bottom: 10px; padding: 6px; box-sizing: border-box;"><br>

            <!-- 文章內容 -->
            <label for="newContent">文章內容：</label><br>
            <textarea id="newContent" rows="5" placeholder="輸入文章內文..." style="width: 100%; margin-bottom: 10px; padding: 6px; box-sizing: border-box;"></textarea><br>

            <!-- 進階設定 (雙欄排列) -->
            <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                <div style="flex: 1;">
                    <label for="newCharsPerLevel">每關字數 (charsPerLevel)：</label>
                    <input type="number" id="newCharsPerLevel" placeholder="預設 500 (例: 150)" style="width: 100%; padding: 6px; box-sizing: border-box;">
                </div>
                <div style="flex: 1;">
                    <label for="newDelimiter">自訂分隔符號 (delimiter)：</label>
                    <input type="text" id="newDelimiter" placeholder="例如: [NEXT] 或 \n\n" style="width: 100%; padding: 6px; box-sizing: border-box;">
                </div>
            </div>

            <!-- 單字註解 -->
            <label for="newAnnotations">單字註解 (Annotations)：</label><br>
            <textarea id="newAnnotations" rows="3" placeholder="每行一組單字與註解，格式：單字:翻譯&#10;例如：&#10;Artificial:人造的&#10;Intelligence:智慧" style="width: 100%; margin-bottom: 15px; padding: 6px; box-sizing: border-box;"></textarea><br>

            <button id="addAndDownloadBtn" class="primary-btn" style="padding: 8px 16px; cursor: pointer;">
                📥 新增並下載最新 articles.json
            </button>
        </div>

        <h2>🌐 Custom Text Mode</h2>

        <div class="custom-text-container" style="display: flex; flex-direction: column; gap: 10px; margin-top: 15px;">
            <label for="custom-text-input">貼上或輸入你想要練習打字的文章：</label>
            <textarea 
                id="custom-text-input" 
                rows="6" 
                placeholder="在此貼上任何英文文章或段落..."
                style="width: 100%; white-space:pre-wrap; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-family: inherit; resize: vertical; box-sizing: border-box;"
            ></textarea>

            <button id="start-custom-text-btn" class="primary-btn" style="align-self: flex-end;">🚀 開始打字練習</button>
        </div>

        <p id="article-status" class="status">
            貼上文章後點擊「開始打字練習」即可生成關卡
        </p>
    </section>

    <!-- ==========================GAME AREA============================ -->

    <section id="game-area" class="game-area hidden">

        <!-- 關卡切換列 -->
        <div class="level-bar">
            <button id="prev-btn" class="secondary-btn">⬅ Previous</button>
            <select id="level-select" class="level-select" disabled>
                <option value=""> Level</option>
            </select>
            <div id="level-display">Level 1 / 1</div>
            <button id="next-btn" class="secondary-btn">Next ➡</button>
        </div>

        <!-- 烏龜跑道 -->
        <div class="turtle-track" id="turtle-track">
            <img class="turtle-display" id="turtle-display" src="img.svg" alt="Interactive Logo" width="50">
            <img class="flag" src="flag.png" alt="Interactive Logo" width="50">
        </div>

        <div class="auto-speak-toggle" style="margin: 10px 0; display: flex; align-items: center; gap: 8px;">
            <input type="checkbox" id="auto-speak-checkbox">
            <label for="auto-speak-checkbox" style="cursor: pointer; user-select: none;">🔊自動朗讀(Auto TTS)</label>
        </div>

        <!-- 文章來源資訊 
        <div class="source-info">
            <div>
                <strong id="content-title">Content</strong>
                <span id="content-source">Source</span>
            </div>
            <a id="original-link" href="#" target="_blank" rel="noopener noreferrer">View Original</a>
        </div>-->

        <!-- 文字顯示區 -->
        <div id="text-display" class="text-display"></div>

        <!-- 字典彈窗 -->
        <div id="dictionary-popup" class="dictionary-popup hidden">
            <button id="dictionary-close" class="dictionary-close">✕</button>
            <h2 id="dictionary-word">Word</h2>
            <div id="dictionary-phonetic"></div>
            <button id="dictionary-audio" class="audio-btn">🔊 發音</button>
            <div id="dictionary-content">正在載入...</div>
        </div>

        <!-- 打字輸入框 -->
        <textarea
            id="typing-input"
            class="typing-input"
            placeholder="Start typing here..."
            spellcheck="false"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="none"
            style="white-space:pre-wrap;"
        ></textarea>

        <!-- 數據統計列 -->
        <div class="stats">
            <div>🎯 Accuracy <strong id="accuracy">100%</strong></div>
            <div>⚡ WPM <strong id="wpm">0</strong></div>
            <div>📝 Progress <strong id="progress">0%</strong></div>
        </div>

        <!-- 重來按鈕 -->
        <button id="restart-btn" class="restart-btn">🔄 Restart Level</button>

    </section>

</div>

<script src="app.js"></script>

</body>

</html>
