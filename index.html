<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PDF Typing Game</title>

    <!-- PDF.js -->
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js">
    </script>

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>

<div class="container">

    <!-- =========================
         HEADER
    ========================== -->

    <header>

        <h1>
            📄 PDF Typing Game
        </h1>

        <p>
            將 PDF 變成打字遊戲
        </p>

    </header>


    <!-- =========================
         IMPORT SECTION
    ========================== -->

    <section class="import-section">

        <h2>
            📥 Import PDF
        </h2>


        <!-- PDF URL -->

        <div class="url-row">

            <input
                type="url"
                id="pdf-url"
                placeholder="貼上 PDF URL，例如 https://example.com/file.pdf"
            >

            <button
                id="load-url-btn"
                class="primary-btn"
            >
                載入
            </button>

        </div>


        <div class="divider">
            <span>或</span>
        </div>


        <!-- Local PDF -->

        <label
            for="pdf-upload"
            class="upload-btn"
        >
            📂 選擇 PDF
        </label>

        <input
            type="file"
            id="pdf-upload"
            accept="application/pdf"
            hidden
        >


        <!-- Status -->

        <p
            id="pdf-status"
            class="status"
        >
            請上傳 PDF 或輸入 PDF 網址
        </p>

    </section>


    <!-- =========================
         GAME AREA
    ========================== -->

    <section
        id="game-area"
        class="game-area hidden"
    >


        <!-- LEVEL BAR -->

        <div class="level-bar">

            <button
                id="prev-btn"
                class="secondary-btn"
            >
                ⬅ 上一關
            </button>


            <div
                id="level-display"
            >
                Level 1 / 1
            </div>


            <button
                id="next-btn"
                class="secondary-btn"
            >
                下一關 ➡
            </button>

        </div>


        <!-- PDF INFORMATION -->

        <div class="pdf-info">

            <strong
                id="pdf-name"
            >
                PDF
            </strong>


            <span
                id="pdf-pages"
            >
                0 pages
            </span>

        </div>


        <!-- TEXT DISPLAY -->

        <div
            id="text-display"
            class="text-display"
        >
        </div>


        <!-- TYPING INPUT -->

        <textarea
            id="typing-input"
            class="typing-input"
            placeholder="在這裡開始打字..."
            spellcheck="false"
            autocapitalize="none"
            autocomplete="off"
            autocorrect="off"
        ></textarea>


        <!-- STATISTICS -->

        <div class="stats">


            <div class="stat-card">

                <span>
                    🎯 Accuracy
                </span>

                <strong
                    id="accuracy"
                >
                    100%
                </strong>

            </div>


            <div class="stat-card">

                <span>
                    ⚡ WPM
                </span>

                <strong
                    id="wpm"
                >
                    0
                </strong>

            </div>


            <div class="stat-card">

                <span>
                    📝 Progress
                </span>

                <strong
                    id="progress"
                >
                    0%
                </strong>

            </div>


        </div>


        <!-- RESTART -->

        <button
            id="restart-btn"
            class="restart-btn"
        >
            🔄 重新開始本關
        </button>


    </section>

</div>


<!-- =========================
     JAVASCRIPT
     必須放在 body 最尾
========================== -->

<script src="app.js"></script>

</body>

</html>
