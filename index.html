<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF & Article Typing Game</title>

    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- ================= HEADER ================= -->

    <header>
        <h1>🎮 Typing Game</h1>
        <p>PDF & Online Article Typing Practice</p>
    </header>


    <!-- ================= MODE SELECT ================= -->

    <section class="mode-section">
        <h2>Choose Game Mode</h2>
        <div class="mode-buttons">
            <button id="pdf-mode-btn" class="mode-btn active">📄 PDF Mode</button>
            <button id="article-mode-btn" class="mode-btn">🌐 Article Mode</button>
        </div>
    </section>


    <!-- =================================================
         PDF MODE
    ================================================== -->

    <section id="pdf-mode" class="mode-panel">
        <h2>📄 Import PDF</h2>

        <!-- PDF URL -->
        <div class="url-row">
            <input id="pdf-url" type="url" placeholder="Paste PDF URL...">
            <button id="load-url-btn" class="primary-btn">Load</button>
        </div>

        <div class="divider">OR</div>

        <!-- Local PDF -->
        <label for="pdf-upload" class="upload-btn">📂 Upload PDF</label>
        <input id="pdf-upload" type="file" accept="application/pdf" hidden>

        <!-- Added missing elements for PDF metadata display -->
        <div class="pdf-info" style="margin-top: 10px;">
            <strong id="pdf-name"></strong>
            <span id="pdf-pages"></span>
        </div>

        <p id="pdf-status" class="status">
            Upload a PDF or enter a PDF URL.
        </p>
    </section>


    <!-- =================================================
         ARTICLE MODE
    ================================================== -->

    <section id="article-mode" class="mode-panel hidden">
        <h2>🌐 Online Article</h2>

        <div class="article-options">
            <label for="article-source">Source</label>
            <select id="article-source">
                <option value="hk-gov">Hong Kong Government News</option>
            </select>

            <label for="article-category">Category</label>
            <select id="article-category">
                <option value="all">All</option>
                <option value="news">News</option>
                <option value="policy">Policy</option>
                <option value="economy">Economy</option>
                <option value="environment">Environment</option>
                <option value="technology">Technology</option>
                <option value="education">Education</option>
            </select>

            <button id="random-article-btn" class="random-btn">🎲 Random Article</button>
        </div>

        <p id="article-status" class="status">
            Choose a source and get a random article.
        </p>
    </section>


    <!-- =================================================
         GAME
    ================================================== -->

    <section id="game-area" class="game-area hidden">

        <!-- Level -->
        <!-- 在 HTML 找到 prev-btn / next-btn 的位置，新增 select 元素 -->
<div class="level-controls">
    <button id="prev-btn" disabled>上一關</button>
    
    <!-- 新增 Level 選擇選單 -->
    <select id="level-select" class="level-select" disabled>
        <option value="">選擇 Level</option>
    </select>

    <button id="next-btn" disabled>下一關</button>
    <button id="restart-btn">重新開始</button>
</div>

        <!-- Source -->
        <div class="source-info">
            <div>
                <strong id="content-title">Content</strong>
                <span id="content-source">Source</span>
            </div>
            <a id="original-link" href="#" target="_blank" rel="noopener noreferrer">View Original</a>
        </div>

        <!-- Text -->
        <div id="text-display" class="text-display"></div>
<!-- Dictionary Popup -->
<div id="dictionary-popup" class="dictionary-popup hidden">

    <button id="dictionary-close" class="dictionary-close">
        ✕
    </button>

    <h2 id="dictionary-word">
        Word
    </h2>

    <div id="dictionary-phonetic">
    </div>

    <button
        id="dictionary-audio"
        class="audio-btn"
    >
        🔊 發音
    </button>

    <div id="dictionary-content">
        正在載入...
    </div>

</div>
        <!-- Typing Input -->
        <textarea
            id="typing-input"
            class="typing-input"
            placeholder="Start typing here..."
            spellcheck="false"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="none"
        ></textarea>

        <!-- Statistics -->
        <div class="stats">
            <div>🎯 Accuracy <strong id="accuracy">100%</strong></div>
            <div>⚡ WPM <strong id="wpm">0</strong></div>
            <div>📝 Progress <strong id="progress">0%</strong></div>
        </div>

        <button id="restart-btn" class="restart-btn">🔄 Restart Level</button>
    </section>

</div>


<script src="app.js">
</script>

</body>

</html>
