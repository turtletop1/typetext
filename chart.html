<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Dynamic Google Charts</title>
    <script src="https://www.gstatic.com/charts/loader.js"></script>
	<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h2>Dynamic Google Charts</h2>
    <div id="myChart" style="width:100%; max-width:800px; height:500px;"></div>

    <h3>Chart Type</h3>
    <select id="type_chart">
        <option value="bar">Bar Chart 📊</option>
        <option value="pie">Pie Chart ◔</option>
    </select>

    <label id="pieColumnLabel" style="display:none;">Pie Value Column:</label>
    <select id="pieColumnSelect" style="display:none;"></select>
    <br><br>

    <h3>Add Row</h3>
    <div id="rowInputs"></div>
    <button id="add_row" class="primary-btn" >Add Row</button> <br><br>


    <h3>Add Column</h3>
    <input type="text" id="newColumnName" placeholder="object attribute">
    <input type="number" id="newColumnValue" placeholder="Default value" value="0">

    <button id="add_column" class="primary-btn">Add Column</button><br><br>


    <h3>Delete Column</h3>
    <select id="deleteColumnSelect"></select> 
    <button id="delete_column" class="primary-btn">Delete Column</button>
    <br><br>


    <h3>Edit / Delete Rows</h3>
    <p>You can edit column titles and row values directly.</p>

    <table border="1" cellpadding="6">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
    </table>

</div>


<script>


google.charts.load('current', {'packages': ['corechart']});
google.charts.setOnLoadCallback(function () {
    displayTable();
    drawChart(typeChart.value);
});


const typeChart = document.getElementById("type_chart");

const rowInputs = document.getElementById("rowInputs");
const addRowButton = document.getElementById("add_row");

const tableHead = document.getElementById("tableHead");
const tableBody = document.getElementById("tableBody");

const newColumnName = document.getElementById("newColumnName");
const newColumnValue = document.getElementById("newColumnValue");

const addColumnButton = document.getElementById("add_column");

const deleteColumnSelect = document.getElementById("deleteColumnSelect");
const deleteColumnButton = document.getElementById("delete_column");

const pieColumnLabel = document.getElementById("pieColumnLabel");
const pieColumnSelect = document.getElementById("pieColumnSelect");



let chartData = [
    ['object_type'],
    ['object 1'],
    ['object 2'],
    ['object 3'],
    ['object 4'],
    ['object 5']
];


//  1: Draw Chart

function drawChart(type) {

    const chartArea = document.getElementById("myChart");

    if (chartData[0].length < 2) {
        chartArea.innerHTML = "Please add a data column before drawing a chart.";
        pieColumnLabel.style.display = "none";
        pieColumnSelect.style.display = "none";
        return;
    }
    let data;

    if (type == "bar") {
        data = google.visualization.arrayToDataTable(chartData);
        const chart = new google.visualization.ColumnChart(chartArea);
        
        chart.draw(data, {
            title: 'Chart Data',
            height: 500
        });

        pieColumnLabel.style.display = "none";
        pieColumnSelect.style.display = "none";

    } else {

        pieColumnLabel.style.display = "inline";         // Pie Chart: show one numeric column at a time
        pieColumnSelect.style.display = "inline";

        updatePieColumnOptions();

        const selectedColumn = Number(pieColumnSelect.value);

        // 第一row包含Pie Chart的labels
        const pieData = [
            [
                chartData[0][0],
                chartData[0][selectedColumn]
            ]
        ];

        
        for (let i = 1; i < chartData.length; i++) {        // Add each row's label and selected numeric value
            pieData.push([
                String(chartData[i][0]),
                Number(chartData[i][selectedColumn]) || 0
            ]);
        }

        data = google.visualization.arrayToDataTable(pieData);
        const chart = new google.visualization.PieChart(chartArea);

        chart.draw(data, {
            title: chartData[0][selectedColumn],
            height: 500
        });
    }
}


// Function 2: Create Add Row Inputs
// Inputs change according to current columns

function displayRowInputs() {

    rowInputs.innerHTML = "";

    for (let j = 0; j < chartData[0].length; j++) {         // Create one input for every column

        const input = document.createElement("input");
        input.id = "newRowValue" + j;
        input.placeholder = "object" + chartData.length;                // Use the column title as the placeholder

        if (j == 0) {
            input.type = "text";                        // First column is a text label
        } else {
            input.type = "number";                      // Other columns contain numbers
            input.value = "0";
        }
        rowInputs.appendChild(input);
    }
}

// 3  Display Table 創建可編輯的headers和rows

function displayTable() {

    tableHead.innerHTML = "";
    tableBody.innerHTML = "";

    const headerRow = document.createElement("tr");     // Create the header row

    for (let j = 0; j < chartData[0].length; j++) {

        const th = document.createElement("th");
        const input = document.createElement("input");

        input.type = "text";
        input.value = chartData[0][j];
        input.title = "Edit column title";

        input.addEventListener("change", function () {       // Edit a column title
            const newTitle = input.value.trim();
            if (newTitle == "") {
                alert("Column title cannot be empty.");
                input.value = chartData[0][j];
                return;
            }

            for (let k = 0; k < chartData[0].length; k++) {         // Check for duplicate column names
                
                if (k != j && chartData[0][k].toLowerCase() == newTitle.toLowerCase()) {
                    alert("This column title already exists.");
                    input.value = chartData[0][j];
                    return;
                }
            }
            chartData[0][j] = newTitle;          // Update the column title
            displayTable();
            drawChart(typeChart.value);
        });

        th.appendChild(input);
        headerRow.appendChild(th);
    }

    const actionHeader = document.createElement("th");

    actionHeader.textContent = "Action";
    headerRow.appendChild(actionHeader);
    tableHead.appendChild(headerRow);


    // Display each data row
    for (let i = 1; i < chartData.length; i++) {

        const tr = document.createElement("tr");

        for (let j = 0; j < chartData[i].length; j++) {

            const td = document.createElement("td");
            const input = document.createElement("input");

            input.type = j == 0 ? "text" : "number";        // First column is text; other columns are numbers
            input.value = chartData[i][j];

            input.addEventListener("change", function () {       // Edit a cell

                if (j == 0) {
                    chartData[i][j] = input.value;
                } else {
                    chartData[i][j] = Number(input.value);
                }
                drawChart(typeChart.value);
            });

            td.appendChild(input);
            tr.appendChild(td);
        }

        const actionTd = document.createElement("td");               // Create Delete Row button
        const deleteButton = document.createElement("button");
        deleteButton.textContent = "Delete";

        deleteButton.addEventListener("click", function () {
            chartData.splice(i, 1);                             // Remove one row from the Array
            displayTable();
            drawChart(typeChart.value);
        });

        actionTd.appendChild(deleteButton);
        tr.appendChild(actionTd);
        tableBody.appendChild(tr);
    }

    updateDeleteColumnOptions();          // Refresh all dynamic controls
    updatePieColumnOptions();
    displayRowInputs();
}


//4 更新刪除列選項

function updateDeleteColumnOptions() {

    deleteColumnSelect.innerHTML = "";

    for (let j = 1; j < chartData[0].length; j++) {             // 從1開始保護第一個標籤列

        const option = document.createElement("option");

        option.value = j;
        option.textContent = chartData[0][j];

        deleteColumnSelect.appendChild(option);
    }

    deleteColumnButton.disabled = chartData[0].length <= 1;     //如果沒有數字列就禁用
}


// 5 更新 Pie Column 選項

function updatePieColumnOptions() {

    const previousValue = pieColumnSelect.value;
    pieColumnSelect.innerHTML = "";

    for (let j = 1; j < chartData[0].length; j++) {             // Add every numeric column to the dropdown

        const option = document.createElement("option");
        option.value = j;
        option.textContent = chartData[0][j];
        pieColumnSelect.appendChild(option);
    }
    if ( previousValue && Number(previousValue) < chartData[0].length ) {    // 如果上一個選擇仍然存在，則保留它
        pieColumnSelect.value = previousValue;
    }
}


// ========================================
// Function 6: Add Row
// Read all current dynamic inputs
// ========================================

addRowButton.addEventListener("click", function () {

    const newRow = [];

    for (let j = 0; j < chartData[0].length; j++) {              // Read one input for each current column

        const input = document.getElementById("newRowValue" + j);

        if (j == 0) {
            if (input.value.trim() == "") {
                alert("Please enter a value for "+ chartData[0][0] + ".");
                return;
            }
            newRow.push(input.value.trim());
        } else {

            if (input.value == "") {
                alert("Please enter a number for "+ chartData[0][j] + ".");
                return;
            }
            newRow.push(Number(input.value));
        }
    }

    chartData.push(newRow);         // Add the completed row

    displayTable();
    drawChart(typeChart.value);
});


// ========================================
// Function 7: Add Column
// ========================================

addColumnButton.addEventListener("click", function () {

    const columnName = newColumnName.value.trim();

    if (columnName == "") {
        alert("Please enter a column name.");
        return;
    }

    for (let j = 0; j < chartData[0].length; j++) {         // 防止重複列名

        if (chartData[0][j].toLowerCase() == columnName.toLowerCase()) {
            alert("This column already exists.");
            return;
        }
    }

    chartData[0].push(columnName);          // Add the new column title

    // Choose the default value for existing rows
    const defaultValue = newColumnValue.value == "" ? 0 : Number(newColumnValue.value);

    for (let i = 1; i < chartData.length; i++) {         // Add the value to every existing row
        chartData[i].push(defaultValue);
    }

    newColumnName.value = "";
    newColumnValue.value = "0";

    displayTable();
    drawChart(typeChart.value);
});


// ========================================
// Function 8: Delete Column
// ========================================

deleteColumnButton.addEventListener("click", function () {

    const columnIndex = Number(deleteColumnSelect.value);

    if (columnIndex <= 0 ||Number.isNaN(columnIndex)) {
        alert("Please select a data column to delete.");
        return;
    }

    const columnName = chartData[0][columnIndex];

    if (!confirm("Delete column '" + columnName + "'?")) {
        return;
    }

    for (let i = 0; i < chartData.length; i++) {
        chartData[i].splice(columnIndex, 1);
    }

    displayTable();
    drawChart(typeChart.value);
});


// ========================================
// Function 9: Switch Chart Type
// ========================================

typeChart.addEventListener("change", function () {
    drawChart(typeChart.value);
});

// ========================================
// Function 10: Change Pie Chart Column
// ========================================

pieColumnSelect.addEventListener("change", function () {
    if (typeChart.value == "pie") {
        drawChart("pie");
    }
});

</script>

</body>
</html>
